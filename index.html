<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123f56"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>مغسلة حميد</title><body><header><b>🧺 مغسلة حميد</b><small> إدارة المغسلة — بدون إنترنت</small></header><main>
<section class=stats><div>👥 الزبائن<b id=cc>0</b></div><div>🧺 الطلبات<b id=oc>0</b></div><div>💰 مبيعات الأسبوع<b id=ws>0</b></div><div>⏳ غير مدفوع<b id=wu>0</b></div></section>
<section class=card><h2>📊 التقرير الأسبوعي</h2><p id=period></p><div class=report><div>إجمالي المبيعات<b id=rs>0</b></div><div>المدفوع<b id=rp>0</b></div><div>غير المدفوع<b id=ru>0</b></div><div>عدد الزبائن<b id=rc>0</b></div><div>عدد الطلبات<b id=ro>0</b></div><div>متوسط الطلب<b id=ra>0</b></div></div><button id=printReport>🖨️ طباعة التقرير</button> <button id=excelReport>📊 Excel للتقرير</button></section>
<section class=card><h2>➕ تسجيل طلب</h2><form id=form><input type=hidden id=eid><div class=grid>
<label>اسم الزبون<input id=name required></label><label>رقم الهاتف<input id=phone required inputmode=tel></label><label>نوع الغسيل<select id=kind><option>ملابس</option><option>حرامات</option><option>سجاد وموكيت</option><option>ستائر</option><option>فرشات</option></select></label><label>الوزن<input id=weight type=number min=0 step=.1 required></label><label>سعر الكيلو<input id=price type=number min=0 step=.01 required></label><label>سعر إضافي<input id=extra type=number min=0 step=.01 value=0></label><label>دواء؟<select id=med><option value=yes>نعم</option><option value=no>لا</option></select></label><label>التاريخ<input id=date type=date required></label><label>اليوم<input id=day readonly></label><label>التسليم المتوقع<input id=delivery type=datetime-local></label><label>الحالة<select id=status><option value=washing>قيد الغسيل</option><option value=ready>جاهز للتسليم</option><option value=delivered>تم التسليم</option></select></label><label>طريقة الدفع<select id=pay><option value=cash>نقداً</option><option value=bank>تحويل بنكي</option><option value=wallet>محفظة إلكترونية</option><option value=jawwalpay>جوال Pay</option></select></label><label>حالة الدفع<select id=paid><option value=paid>مدفوع</option><option value=unpaid>غير مدفوع</option></select></label><label>مرجع الدفع<input id=ref></label><label class=full>ملاحظات<input id=notes></label></div><div class=total>الإجمالي: <b id=total>0.00</b></div><button type=submit id=save>💾 حفظ الطلب</button> <button type=button id=cancel hidden>إلغاء</button></form></section>
<section class=card><h2>👥 الزبائن</h2><input id=search placeholder="🔎 ابحث بالاسم أو الهاتف"><div id=customers></div><div id=empty>لا يوجد زبائن.</div></section>
<section class=card><h2>📅 تصدير فترة</h2><label>من<input id=from type=date></label><label>إلى<input id=to type=date></label><button id=excelCustom>📊 تصدير Excel</button></section></main><div id=offline>● يعمل بدون إنترنت</div><div id=toast></div><script src=app.js></script>
